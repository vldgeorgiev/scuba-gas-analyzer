; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = t-display-s3
; default_envs = esp32dev

[embedded]
platform = espressif32@7.1.3
framework = arduino
test_ignore = test_*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  adafruit/Adafruit ADS1X15@2.6.2
  adafruit/Adafruit BusIO@1.17.4
  robtillaart/RunningAverage@0.4.9
  lvgl@9.5.0

build_flags =
  ; TFT_eSPI library setting here (no need to edit library files):
  -D USER_SETUP_LOADED=1
  -include src/display/TFT_eSPI_setup.h
  ; LVGL library
  -D LV_CONF_SKIP
  -include src/display/lv_conf.h
  ; EEZ-Studio and EEZ-Framework settings
  -D LV_LVGL_H_INCLUDE_SIMPLE

[env:esp32dev]
extends = embedded
board = esp32dev
build_flags =
  -D CORE_DEBUG_LEVEL=4
  ${embedded.build_flags}

[t-display-s3-common]
extends = embedded
board = lilygo-t-display-s3
lib_deps =
  ${embedded.lib_deps}
  https://github.com/mmMicky/TouchLib.git#ccaedcd9155ef8a6560ae9f594ea92e32c68020f

build_flags =
  ${embedded.build_flags}
  -D TOUCH_MODULES_CST_SELF ; Use the CST816 touch controller. Defining TOUCH_MODULES_CST_MUTUAL switches to CST328, which doesn't work
  -D DISABLE_ALL_LIBRARY_WARNINGS ; TfT eSPI warnings
  -UARDUINO_USB_MODE ; Touch doesn't work with USB mode enabled

[env:t-display-s3]
extends = t-display-s3-common
build_flags =
  -D CORE_DEBUG_LEVEL=4
  ${t-display-s3-common.build_flags}

[env:t-display-s3-release]
extends = t-display-s3-common
build_flags =
  -D CORE_DEBUG_LEVEL=1
  ${t-display-s3-common.build_flags}

[env:native]
platform = native@1.2.1
lib_ignore = ui
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<sensors/conversions.cpp>
  +<sensors/sensors.cpp>
  +<app/Analyzer.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I test/fakes
  -iquote test/fakes